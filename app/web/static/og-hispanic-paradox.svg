<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative grid pattern -->
  <g opacity="0.05" stroke="#94a3b8" stroke-width="1">
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Eyebrow -->
  <text x="600" y="60" font-family="system-ui, sans-serif" font-size="18" fill="#94a3b8" text-anchor="middle" letter-spacing="2">NEW RESEARCH</text>

  <!-- Title -->
  <text x="600" y="115" font-family="Georgia, serif" font-size="38" fill="#f1f5f9" text-anchor="middle">The "Hispanic Paradox" Is an Aggregation Artifact</text>

  <!-- Subtitle -->
  <text x="600" y="155" font-family="system-ui, sans-serif" font-size="20" fill="#64748b" text-anchor="middle">The aggregate statistic masks dramatic heterogeneity</text>

  <!-- Chart area -->
  <!-- Zero line -->
  <line x1="450" y1="200" x2="450" y2="500" stroke="#475569" stroke-width="2" stroke-dasharray="4"/>
  <text x="450" y="520" font-family="system-ui, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">0</text>

  <!-- Bar chart -->
  <!-- South American -->
  <text x="140" y="235" font-family="system-ui, sans-serif" font-size="16" fill="#f1f5f9" text-anchor="start">South American</text>
  <rect x="450" y="220" width="294" height="30" rx="4" fill="#22c55e"/>
  <text x="754" y="242" font-family="JetBrains Mono, monospace" font-size="16" fill="#22c55e" font-weight="bold">+0.147</text>

  <!-- Central American -->
  <text x="140" y="285" font-family="system-ui, sans-serif" font-size="16" fill="#f1f5f9" text-anchor="start">Central American</text>
  <rect x="450" y="270" width="120" height="30" rx="4" fill="#22c55e"/>
  <text x="580" y="292" font-family="JetBrains Mono, monospace" font-size="16" fill="#22c55e" font-weight="bold">+0.060</text>

  <!-- Cuban -->
  <text x="140" y="335" font-family="system-ui, sans-serif" font-size="16" fill="#f1f5f9" text-anchor="start">Cuban</text>
  <rect x="390" y="320" width="60" height="30" rx="4" fill="#ef4444"/>
  <text x="320" y="342" font-family="JetBrains Mono, monospace" font-size="16" fill="#ef4444" font-weight="bold">-0.030</text>

  <!-- Mexican -->
  <text x="140" y="385" font-family="system-ui, sans-serif" font-size="16" fill="#f1f5f9" text-anchor="start">Mexican</text>
  <rect x="392" y="370" width="58" height="30" rx="4" fill="#ef4444"/>
  <text x="320" y="392" font-family="JetBrains Mono, monospace" font-size="16" fill="#ef4444" font-weight="bold">-0.029</text>

  <!-- Puerto Rican -->
  <text x="140" y="435" font-family="system-ui, sans-serif" font-size="16" fill="#f1f5f9" text-anchor="start">Puerto Rican</text>
  <rect x="416" y="420" width="34" height="30" rx="4" fill="#ef4444"/>
  <text x="320" y="442" font-family="JetBrains Mono, monospace" font-size="16" fill="#ef4444" font-weight="bold">-0.017</text>

  <!-- Aggregate (highlighted) -->
  <rect x="130" y="470" width="740" height="40" rx="8" fill="#334155" stroke="#64748b" stroke-width="1"/>
  <text x="145" y="497" font-family="system-ui, sans-serif" font-size="16" fill="#94a3b8" text-anchor="start">Aggregate "Hispanic"</text>
  <line x1="450" y1="475" x2="450" y2="505" stroke="#64748b" stroke-width="2"/>
  <text x="462" y="497" font-family="JetBrains Mono, monospace" font-size="16" fill="#64748b" font-weight="bold">+0.006 ≈ 0</text>

  <!-- Texas callout -->
  <rect x="900" y="250" width="260" height="180" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="1030" y="285" font-family="system-ui, sans-serif" font-size="14" fill="#f59e0b" text-anchor="middle" font-weight="600">WITHIN TEXAS</text>
  <text x="1030" y="330" font-family="system-ui, sans-serif" font-size="16" fill="#f1f5f9" text-anchor="middle">Austin: <tspan fill="#22c55e" font-weight="bold">+1.53</tspan></text>
  <text x="1030" y="365" font-family="system-ui, sans-serif" font-size="16" fill="#f1f5f9" text-anchor="middle">Border: <tspan fill="#ef4444" font-weight="bold">-1.08</tspan></text>
  <text x="1030" y="410" font-family="system-ui, sans-serif" font-size="20" fill="#f59e0b" text-anchor="middle" font-weight="bold">2.6 SD gap</text>

  <!-- URL -->
  <text x="600" y="590" font-family="monospace" font-size="16" fill="#94a3b8" text-anchor="middle">odds.health/research/papers/immigrant-health-advantage</text>
</svg>
