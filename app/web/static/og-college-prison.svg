<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="positive" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#10b981"/>
    </linearGradient>
    <linearGradient id="negative" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#dc2626"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative grid pattern -->
  <g opacity="0.05" stroke="#94a3b8" stroke-width="1">
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
    <line x1="0" y1="126" x2="1200" y2="126"/>
    <line x1="0" y1="252" x2="1200" y2="252"/>
    <line x1="0" y1="378" x2="1200" y2="378"/>
    <line x1="0" y1="504" x2="1200" y2="504"/>
  </g>

  <!-- Eyebrow -->
  <text x="600" y="80" font-family="system-ui, sans-serif" font-size="18" fill="#94a3b8" text-anchor="middle" letter-spacing="2">KEY FINDING</text>

  <!-- Title -->
  <text x="600" y="140" font-family="Georgia, serif" font-size="42" fill="#f1f5f9" text-anchor="middle">College vs Prison: A 4 SD Health Divide</text>

  <!-- Comparison Cards -->
  <!-- College Card -->
  <rect x="120" y="200" width="440" height="280" rx="16" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="340" y="280" font-family="JetBrains Mono, monospace" font-size="80" fill="#22c55e" text-anchor="middle" font-weight="bold">+2.95</text>
  <text x="340" y="340" font-family="system-ui, sans-serif" font-size="28" fill="#f1f5f9" text-anchor="middle" font-weight="600">College Towns</text>
  <text x="340" y="380" font-family="system-ui, sans-serif" font-size="18" fill="#94a3b8" text-anchor="middle">Among the healthiest</text>
  <text x="340" y="410" font-family="system-ui, sans-serif" font-size="18" fill="#94a3b8" text-anchor="middle">communities in America</text>

  <!-- VS Circle -->
  <circle cx="600" cy="340" r="40" fill="#334155"/>
  <text x="600" y="350" font-family="system-ui, sans-serif" font-size="24" fill="#94a3b8" text-anchor="middle" font-weight="600">vs</text>

  <!-- Prison Card -->
  <rect x="640" y="200" width="440" height="280" rx="16" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  <text x="860" y="280" font-family="JetBrains Mono, monospace" font-size="80" fill="#ef4444" text-anchor="middle" font-weight="bold">-0.98</text>
  <text x="860" y="340" font-family="system-ui, sans-serif" font-size="28" fill="#f1f5f9" text-anchor="middle" font-weight="600">Prison Towns</text>
  <text x="860" y="380" font-family="system-ui, sans-serif" font-size="18" fill="#94a3b8" text-anchor="middle">Among the least healthy</text>
  <text x="860" y="410" font-family="system-ui, sans-serif" font-size="18" fill="#94a3b8" text-anchor="middle">communities in America</text>

  <!-- Subtitle -->
  <text x="600" y="540" font-family="system-ui, sans-serif" font-size="22" fill="#64748b" text-anchor="middle">Same country. Same healthcare system. 4 standard deviations apart.</text>

  <!-- URL -->
  <text x="600" y="590" font-family="monospace" font-size="16" fill="#94a3b8" text-anchor="middle">odds.health/research/special-populations</text>
</svg>
