<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative grid pattern -->
  <g opacity="0.05" stroke="#94a3b8" stroke-width="1">
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Eyebrow -->
  <text x="600" y="70" font-family="system-ui, sans-serif" font-size="18" fill="#94a3b8" text-anchor="middle" letter-spacing="2">OHIO REGIONAL STORY</text>

  <!-- Title -->
  <text x="600" y="130" font-family="Georgia, serif" font-size="44" fill="#f1f5f9" text-anchor="middle">Ohio's Health Divide</text>

  <!-- Subtitle -->
  <text x="600" y="175" font-family="system-ui, sans-serif" font-size="22" fill="#64748b" text-anchor="middle">Same state. 140 miles apart. 10+ standard deviations different.</text>

  <!-- Columbus Card -->
  <rect x="100" y="220" width="460" height="300" rx="16" fill="#1e293b" stroke="#22c55e" stroke-width="3"/>
  <text x="330" y="280" font-family="Georgia, serif" font-size="36" fill="#22c55e" text-anchor="middle" font-weight="bold">COLUMBUS</text>

  <text x="330" y="350" font-family="JetBrains Mono, monospace" font-size="72" fill="#22c55e" text-anchor="middle" font-weight="bold">4</text>
  <text x="330" y="400" font-family="system-ui, sans-serif" font-size="22" fill="#f1f5f9" text-anchor="middle">of top 10 tracts</text>
  <text x="330" y="435" font-family="system-ui, sans-serif" font-size="22" fill="#f1f5f9" text-anchor="middle" font-weight="600">nationally</text>

  <text x="330" y="490" font-family="system-ui, sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">Among the healthiest</text>
  <text x="330" y="510" font-family="system-ui, sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">communities in America</text>

  <!-- Distance indicator -->
  <line x1="570" y1="370" x2="630" y2="370" stroke="#64748b" stroke-width="2"/>
  <text x="600" y="350" font-family="system-ui, sans-serif" font-size="16" fill="#64748b" text-anchor="middle">140 mi</text>

  <!-- Cleveland Card -->
  <rect x="640" y="220" width="460" height="300" rx="16" fill="#1e293b" stroke="#ef4444" stroke-width="3"/>
  <text x="870" y="280" font-family="Georgia, serif" font-size="36" fill="#ef4444" text-anchor="middle" font-weight="bold">CLEVELAND</text>

  <text x="870" y="350" font-family="JetBrains Mono, monospace" font-size="72" fill="#ef4444" text-anchor="middle" font-weight="bold">3</text>
  <text x="870" y="400" font-family="system-ui, sans-serif" font-size="22" fill="#f1f5f9" text-anchor="middle">of bottom 10 tracts</text>
  <text x="870" y="435" font-family="system-ui, sans-serif" font-size="22" fill="#f1f5f9" text-anchor="middle" font-weight="600">nationally</text>

  <text x="870" y="490" font-family="system-ui, sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">Among the least healthy</text>
  <text x="870" y="510" font-family="system-ui, sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">communities in America</text>

  <!-- URL -->
  <text x="600" y="580" font-family="monospace" font-size="16" fill="#94a3b8" text-anchor="middle">odds.health/research/ohio-bifurcation</text>
</svg>
