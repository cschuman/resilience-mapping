# Health Resilience Mapping Platform - Production Environment
# Created: January 31, 2025
# Purpose: Production-ready container orchestration

version: '3.8'

services:
  # ============================================================================
  # API SERVER - PRODUCTION
  # ============================================================================
  
  api:
    build:
      context: .
      dockerfile: deployments/docker/api.Dockerfile
      target: production
    image: resilience/api-server:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Database (use external managed database in production)
      DATABASE_URL: ${DATABASE_URL}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSL_MODE: ${DB_SSL_MODE:-require}
      
      # Cache (use external managed Redis in production)
      REDIS_URL: ${REDIS_URL}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      
      # Search (use external managed Elasticsearch in production)
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL}
      ELASTICSEARCH_HOST: ${ELASTICSEARCH_HOST}
      ELASTICSEARCH_PORT: ${ELASTICSEARCH_PORT:-9200}
      ELASTICSEARCH_USERNAME: ${ELASTICSEARCH_USERNAME}
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD}
      
      # Email
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      
      # Application
      APP_ENV: production
      APP_PORT: 8080
      APP_DEBUG: false
      LOG_LEVEL: ${LOG_LEVEL:-info}
      
      # Security
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY: ${JWT_EXPIRY:-24h}
      
      # CORS
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      
      # Rate Limiting
      RATE_LIMIT_REQUESTS_PER_MINUTE: ${RATE_LIMIT_REQUESTS_PER_MINUTE:-60}
      
      # File Storage (AWS S3)
      STORAGE_TYPE: s3
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      
      # Monitoring
      ENABLE_METRICS: true
      METRICS_PORT: 9090
      
      # External Services
      SENTRY_DSN: ${SENTRY_DSN}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'
    networks:
      - resilience-network
    labels:
      - "resilience.service=api"
      - "resilience.environment=production"
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.resilience-mapping.org`)"
      - "traefik.http.routers.api.tls=true"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"

  # ============================================================================
  # FRONTEND SERVICES - PRODUCTION
  # ============================================================================
  
  frontend-stories:
    build:
      context: .
      dockerfile: deployments/docker/frontend.Dockerfile
      target: production
      args:
        FRONTEND_DIR: frontend
    image: resilience/frontend-stories:latest
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_SITE_URL: ${STORIES_SITE_URL}
      NEXT_PUBLIC_RESEARCH_URL: ${RESEARCH_SITE_URL}
      NEXT_PUBLIC_POLICY_URL: ${POLICY_SITE_URL}
      NEXT_PUBLIC_ENV: production
      NODE_ENV: production
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          memory: 512M
          cpus: '0.25'
        reservations:
          memory: 256M
          cpus: '0.125'
    networks:
      - resilience-network
    labels:
      - "resilience.service=frontend-stories"
      - "resilience.environment=production"
      - "traefik.enable=true"
      - "traefik.http.routers.stories.rule=Host(`stories.resilience-mapping.org`)"
      - "traefik.http.routers.stories.tls=true"
      - "traefik.http.routers.stories.tls.certresolver=letsencrypt"

  frontend-research:
    build:
      context: .
      dockerfile: deployments/docker/frontend.Dockerfile
      target: production
      args:
        FRONTEND_DIR: frontend-research
    image: resilience/frontend-research:latest
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_SITE_URL: ${RESEARCH_SITE_URL}
      NEXT_PUBLIC_STORIES_URL: ${STORIES_SITE_URL}
      NEXT_PUBLIC_POLICY_URL: ${POLICY_SITE_URL}
      NEXT_PUBLIC_ENV: production
      NODE_ENV: production
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          memory: 512M
          cpus: '0.25'
        reservations:
          memory: 256M
          cpus: '0.125'
    networks:
      - resilience-network
    labels:
      - "resilience.service=frontend-research"
      - "resilience.environment=production"
      - "traefik.enable=true"
      - "traefik.http.routers.research.rule=Host(`research.resilience-mapping.org`)"
      - "traefik.http.routers.research.tls=true"
      - "traefik.http.routers.research.tls.certresolver=letsencrypt"

  frontend-policy:
    build:
      context: .
      dockerfile: deployments/docker/frontend.Dockerfile
      target: production
      args:
        FRONTEND_DIR: frontend-policy
    image: resilience/frontend-policy:latest
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_SITE_URL: ${POLICY_SITE_URL}
      NEXT_PUBLIC_STORIES_URL: ${STORIES_SITE_URL}
      NEXT_PUBLIC_RESEARCH_URL: ${RESEARCH_SITE_URL}
      NEXT_PUBLIC_ENV: production
      NODE_ENV: production
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          memory: 512M
          cpus: '0.25'
        reservations:
          memory: 256M
          cpus: '0.125'
    networks:
      - resilience-network
    labels:
      - "resilience.service=frontend-policy"
      - "resilience.environment=production"
      - "traefik.enable=true"
      - "traefik.http.routers.policy.rule=Host(`policy.resilience-mapping.org`)"
      - "traefik.http.routers.policy.tls=true"
      - "traefik.http.routers.policy.tls.certresolver=letsencrypt"

  # ============================================================================
  # REVERSE PROXY & LOAD BALANCER
  # ============================================================================
  
  traefik:
    image: traefik:v2.9
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"  # Traefik dashboard
    environment:
      TRAEFIK_LOG_LEVEL: ${TRAEFIK_LOG_LEVEL:-INFO}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/traefik/traefik.yml:/traefik.yml:ro
      - ./config/traefik/dynamic.yml:/dynamic.yml:ro
      - traefik_certificates:/certificates
    networks:
      - resilience-network
      - web
    labels:
      - "resilience.service=proxy"
      - "resilience.environment=production"
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.resilience-mapping.org`)"
      - "traefik.http.routers.traefik.tls=true"
      - "traefik.http.routers.traefik.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik.service=api@internal"

  # ============================================================================
  # BACKGROUND WORKERS
  # ============================================================================
  
  worker-etl:
    build:
      context: .
      dockerfile: deployments/docker/worker.Dockerfile
      target: production
      args:
        WORKER_TYPE: etl
    image: resilience/worker-etl:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      WORKER_TYPE: etl
      WORKER_CONCURRENCY: ${ETL_WORKER_CONCURRENCY:-2}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    deploy:
      replicas: 2
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'
    networks:
      - resilience-network
    labels:
      - "resilience.service=worker-etl"
      - "resilience.environment=production"

  worker-notifications:
    build:
      context: .
      dockerfile: deployments/docker/worker.Dockerfile
      target: production
      args:
        WORKER_TYPE: notifications
    image: resilience/worker-notifications:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      WORKER_TYPE: notifications
      WORKER_CONCURRENCY: ${NOTIFICATION_WORKER_CONCURRENCY:-3}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    deploy:
      replicas: 2
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          memory: 512M
          cpus: '0.25'
        reservations:
          memory: 256M
          cpus: '0.125'
    networks:
      - resilience-network
    labels:
      - "resilience.service=worker-notifications"
      - "resilience.environment=production"

  # ============================================================================
  # MONITORING & LOGGING
  # ============================================================================
  
  prometheus:
    image: prom/prometheus:v2.40.0
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.retention.time=30d'
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'
    networks:
      - resilience-network
    labels:
      - "resilience.service=monitoring"
      - "resilience.environment=production"
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.resilience-mapping.org`)"
      - "traefik.http.routers.prometheus.tls=true"
      - "traefik.http.routers.prometheus.tls.certresolver=letsencrypt"

  grafana:
    image: grafana/grafana:9.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SECURITY_SECRET_KEY: ${GRAFANA_SECRET_KEY}
      GF_USERS_ALLOW_SIGN_UP: false
      GF_ANALYTICS_REPORTING_ENABLED: false
      GF_ANALYTICS_CHECK_FOR_UPDATES: false
      GF_INSTALL_PLUGINS: ${GRAFANA_PLUGINS:-}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          memory: 512M
          cpus: '0.25'
        reservations:
          memory: 256M
          cpus: '0.125'
    networks:
      - resilience-network
    depends_on:
      - prometheus
    labels:
      - "resilience.service=dashboard"
      - "resilience.environment=production"
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.resilience-mapping.org`)"
      - "traefik.http.routers.grafana.tls=true"
      - "traefik.http.routers.grafana.tls.certresolver=letsencrypt"

  # ============================================================================
  # LOG AGGREGATION
  # ============================================================================
  
  fluentd:
    image: fluent/fluentd:v1.15-debian-1
    restart: unless-stopped
    volumes:
      - ./config/fluentd/fluent.conf:/fluentd/etc/fluent.conf:ro
      - fluentd_logs:/var/log/fluentd
    ports:
      - "24224:24224"
      - "24224:24224/udp"
    environment:
      FLUENTD_CONF: fluent.conf
      FLUENTD_OPT: -v
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          memory: 512M
          cpus: '0.25'
        reservations:
          memory: 256M
          cpus: '0.125'
    networks:
      - resilience-network
    labels:
      - "resilience.service=logging"
      - "resilience.environment=production"

# ============================================================================
# NETWORKS
# ============================================================================

networks:
  resilience-network:
    name: resilience-production-network
    driver: overlay
    attachable: true
    ipam:
      config:
        - subnet: 10.0.1.0/24
  
  web:
    name: web
    external: true

# ============================================================================
# VOLUMES
# ============================================================================

volumes:
  traefik_certificates:
    name: resilience-traefik-certificates
    driver: local
  
  prometheus_data:
    name: resilience-prometheus-data-prod
    driver: local
  
  grafana_data:
    name: resilience-grafana-data-prod
    driver: local
  
  fluentd_logs:
    name: resilience-fluentd-logs
    driver: local

# ============================================================================
# PRODUCTION DEPLOYMENT NOTES
# ============================================================================

# Environment Variables Required:
# 
# Database:
# - DATABASE_URL
# - DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD
# 
# Cache:
# - REDIS_URL or REDIS_HOST, REDIS_PORT, REDIS_PASSWORD
# 
# Search:
# - ELASTICSEARCH_URL or ELASTICSEARCH_HOST, ELASTICSEARCH_PORT
# - ELASTICSEARCH_USERNAME, ELASTICSEARCH_PASSWORD
# 
# Email:
# - SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASSWORD, SMTP_FROM
# 
# Security:
# - JWT_SECRET (strong random value)
# - GRAFANA_ADMIN_PASSWORD, GRAFANA_SECRET_KEY
# 
# URLs:
# - NEXT_PUBLIC_API_URL
# - STORIES_SITE_URL, RESEARCH_SITE_URL, POLICY_SITE_URL
# - CORS_ALLOWED_ORIGINS
# 
# Storage:
# - AWS_REGION, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, S3_BUCKET_NAME
# 
# External Services:
# - SENTRY_DSN (optional)
#
# Deployment Commands:
# 
# 1. Deploy to Docker Swarm:
#    docker stack deploy -c docker-compose.prod.yml resilience
# 
# 2. Scale services:
#    docker service scale resilience_api=6
# 
# 3. Update service:
#    docker service update --image resilience/api-server:v1.2.0 resilience_api
# 
# 4. View logs:
#    docker service logs -f resilience_api
# 
# 5. Remove stack:
#    docker stack rm resilience
#
# Health Checks:
# - All services have health checks configured
# - Traefik will automatically route traffic to healthy instances
# - Failed containers are automatically restarted
# 
# SSL/TLS:
# - Automatic SSL certificates via Let's Encrypt
# - Traefik handles SSL termination
# - All traffic redirected to HTTPS
# 
# Scaling:
# - API: 3 replicas (can scale to 50+)
# - Frontend: 2 replicas each (can scale to 20+)
# - Workers: 2 replicas each (can scale based on queue size)
# - Database and cache should be external managed services
# 
# Monitoring:
# - Prometheus metrics collection
# - Grafana dashboards
# - Application logs via Fluentd
# - Health check monitoring